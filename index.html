<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaCoin Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #161b22;
            --accent-color: #f3ba2f;
            --text-color: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .balance-card {
            background: linear-gradient(135deg, #f3ba2f 0%, #d97706 100%);
            color: #0b0d12;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(243, 186, 47, 0.2);
        }

        .balance-card h1 {
            margin: 5px 0 0 0;
            font-size: 32px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: var(--accent-color);
            font-weight: bold;
        }

        .btn {
            background: var(--accent-color);
            color: #0b0d12;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-approved { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .tab-header {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .sub-tab {
            flex: 1;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }
        .sub-tab.active {
            background: var(--accent-color);
            color: #0b0d12;
            font-weight: bold;
            border-color: transparent;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span id="userName">Loading user...</span>
            <span style="font-size: 12px; color: var(--accent-color);" id="userId">ID: ...</span>
        </div>

        <!-- HOME SECTION -->
        <div id="sec-home" class="section">
            <div class="balance-card">
                <span>Total Balance</span>
                <h1 id="userBalance">0.00 MC</h1>
            </div>
            <div class="card">
                <h3>Welcome to MegaCoin!</h3>
                <p style="color: var(--text-secondary); font-size: 13px;">Complete tasks, earn MegaCoins, and withdraw your earnings easily.</p>
            </div>
        </div>

        <!-- TASKS SECTION -->
        <div id="sec-tasks" class="section" style="display: none;">
            <h3>Available Tasks</h3>
            <div id="taskList">Loading tasks...</div>
        </div>

        <!-- WALLET SECTION -->
        <div id="sec-wallet" class="section" style="display: none;">
            <h3>Withdraw MegaCoin</h3>
            <div class="card">
                <div class="form-group">
                    <label>Amount (MC)</label>
                    <input type="number" id="withdrawAmount" placeholder="Enter amount">
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="withdrawMethod">
                        <option value="USDT_BEP20">USDT (BEP20)</option>
                        <option value="Telebirr">Telebirr</option>
                        <option value="CBE">Commercial Bank of Ethiopia</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Account Detail / Wallet Address</label>
                    <input type="text" id="withdrawDetail" placeholder="Account number or wallet">
                </div>
                <button class="btn" onclick="submitWithdrawal()">Request Withdrawal</button>
            </div>
        </div>

        <!-- HISTORY SECTION -->
        <div id="sec-history" class="section" style="display: none;">
            <div class="tab-header">
                <div class="sub-tab active" onclick="switchHistoryTab('tasks', this)">Task Submissions</div>
                <div class="sub-tab" onclick="switchHistoryTab('withdrawals', this)">Withdrawal Logs</div>
            </div>
            <div id="historyContent">Loading history...</div>
        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchSection('home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="switchSection('tasks', this)">📋<br>Tasks</div>
        <div class="nav-item" onclick="switchSection('wallet', this)">👛<br>Wallet</div>
        <div class="nav-item" onclick="switchSection('history', this)">🕒<br>History</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xqxnpdqzsnlmeltyuucg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxeG5wZHF6c25sbWVsdHl1dWNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NDI0NjksImV4cCI6MjEwMTAxODQ2OX0.1AYsGB2Pi1vUp1Q9tLCX8qF0zbvh-lFgHpsDBpbUphA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tg = window.Telegram.WebApp;
        tg.expand();

        // Test user fallback if opened outside Telegram
        let user = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : {
            id: 7450378467,
            first_name: "Test",
            username: "Megacoin15"
        };

        let telegram_id = user.id;
        let username = user.username || user.first_name || "User";
        let currentBalance = 0;
        let activeHistoryTab = 'tasks';

        document.getElementById('userName').innerText = '@' + username;
        document.getElementById('userId').innerText = 'ID: ' + telegram_id;

        async function initUser() {
            let { data, error } = await supabaseClient.from('users').select('*').eq('telegram_id', telegram_id).single();
            if (!data) {
                await supabaseClient.from('users').insert([{ telegram_id: telegram_id, username: username, balance: 0 }]);
                currentBalance = 0;
            } else {
                currentBalance = data.balance;
                // Update username if changed
                if(data.username !== username) {
                    await supabaseClient.from('users').update({ username: username }).eq('telegram_id', telegram_id);
                }
            }
            document.getElementById('userBalance').innerText = currentBalance.toLocaleString() + ' MC';
            loadTasks();
        }

        async function loadTasks() {
            let { data } = await supabaseClient.from('tasks').select('*').eq('status', 'active');
            let html = '';
            if (data && data.length > 0) {
                data.forEach(t => {
                    html += `<div class="card">
                        <p><b>${t.task_name}</b></p>
                        <p style="color:var(--accent-color); font-size:13px;">Reward: +${t.reward} MC</p>
                        <button class="btn" onclick="completeTask('${t.task_name}', ${t.reward}, '${t.link || '#'}')">Start / Verify Task</button>
                    </div>`;
                });
            } else { html = '<p style="text-align:center; color:var(--text-secondary);">No active tasks available.</p>'; }
            document.getElementById('taskList').innerHTML = html;
        }

        async function completeTask(taskName, reward, link) {
            if(link && link !== '#') { window.open(link, '_blank'); }
            
            // Check if already submitted
            let { data } = await supabaseClient.from('task_submissions').select('*').eq('telegram_id', telegram_id).eq('task_name', taskName).single();
            if(data) {
                alert('You have already submitted this task!');
                return;
            }

            let { error } = await supabaseClient.from('task_submissions').insert([{
                telegram_id: telegram_id,
                task_name: taskName,
                reward_amount: reward,
                status: 'pending'
            }]);

            if(error) {
                alert('Error submitting task: ' + error.message);
            } else {
                alert('Task submitted successfully! Waiting for admin approval.');
                loadHistory();
            }
        }

        async function submitWithdrawal() {
            let amount = parseFloat(document.getElementById('withdrawAmount').value);
            let method = document.getElementById('withdrawMethod').value;
            let detail = document.getElementById('withdrawDetail').value;

            if(!amount || amount <= 0) return alert('Please enter a valid amount');
            if(!detail) return alert('Please enter account details or wallet address');
            if(amount > currentBalance) return alert('Insufficient balance');

            let { error } = await supabaseClient.from('withdrawals').insert([{
                telegram_id: telegram_id,
                amount_mc: amount,
                payment_method: method,
                account_detail: detail,
                status: 'pending'
            }]);

            if(error) {
                alert('Error requesting withdrawal: ' + error.message);
            } else {
                // Deduct balance temporarily or wait for admin? Standard practice: deduct or hold. Let's deduct:
                let newBal = currentBalance - amount;
                await supabaseClient.from('users').update({ balance: newBal }).eq('telegram_id', telegram_id);
                currentBalance = newBal;
                document.getElementById('userBalance').innerText = currentBalance.toLocaleString() + ' MC';
                
                alert('Withdrawal request submitted successfully!');
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('withdrawDetail').value = '';
                switchSection('history', document.querySelectorAll('.nav-item')[3]);
            }
        }

        async function loadHistory() {
            let html = '';
            if(activeHistoryTab === 'tasks') {
                let { data } = await supabaseClient.from('task_submissions').select('*').eq('telegram_id', telegram_id).order('created_at', { ascending: false });
                if(data && data.length > 0) {
                    data.forEach(item => {
                        let st = (item.status || 'pending').toLowerCase();
                        html += `<div class="card">
                            <p><b>Task:</b> ${item.task_name} (+${item.reward_amount} MC)</p>
                            <p><b>Status:</b> <span class="status-badge status-${st}">${st}</span></p>
                        </div>`;
                    });
                } else { html = '<p style="text-align:center; color:var(--text-secondary);">No task submissions found.</p>'; }
            } else {
                let { data } = await supabaseClient.from('withdrawals').select('*').eq('telegram_id', telegram_id).order('created_at', { ascending: false });
                if(data && data.length > 0) {
                    data.forEach(item => {
                        let st = (item.status || 'pending').toLowerCase();
                        html += `<div class="card">
                            <p><b>Withdrawal (${item.payment_method})</b></p>
                            <p style="color:var(--accent-color);">${item.amount_mc} MC</p>
                            <p><b>Status:</b> <span class="status-badge status-${st}">${st}</span></p>
                        </div>`;
                    });
                } else { html = '<p style="text-align:center; color:var(--text-secondary);">No withdrawal logs found.</p>'; }
            }
            document.getElementById('historyContent').innerHTML = html;
        }

        function switchSection(sec, element) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            document.getElementById('sec-' + sec).style.display = 'block';
            element.classList.add('active');

            if(sec === 'history') { loadHistory(); }
            if(sec === 'home') { initUser(); }
        }

        function switchHistoryTab(tab, element) {
            document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            activeHistoryTab = tab;
            loadHistory();
        }

        initUser();
    </script>
</body>
</html>
