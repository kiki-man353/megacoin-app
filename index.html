<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaCoin Advanced Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #161b22;
            --accent-color: #f3ba2f;
            --text-color: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        h2 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 20px;
        }

        .tab-header {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #0b0d12;
            border-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card p {
            margin: 5px 0;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .card p b {
            color: var(--text-color);
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-approve { background: var(--success-color); color: white; }
        .btn-reject { background: var(--danger-color); color: white; }
        .btn-edit { background: #3b82f6; color: white; }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-approved { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .empty-msg { text-align: center; color: var(--text-secondary); margin-top: 30px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡️ MegaCoin Admin Panel</h2>

        <div class="tab-header">
            <div class="tab-btn active" onclick="switchTab('withdrawals')">Withdrawals</div>
            <div class="tab-btn" onclick="switchTab('tasks')">Task Submissions</div>
            <div class="tab-btn" onclick="switchTab('users')">Manage Users</div>
            <div class="tab-btn" onclick="switchTab('add_task')">Add New Task</div>
        </div>

        <div id="section-withdrawals"><div id="list-withdrawals">Loading...</div></div>
        <div id="section-tasks" style="display: none;"><div id="list-tasks">Loading...</div></div>
        <div id="section-users" style="display: none;"><div id="list-users">Loading...</div></div>
        
        <div id="section-add_task" style="display: none;" class="card">
            <h3>Create New Task</h3>
            <div class="form-group">
                <label>Task Name</label>
                <input type="text" id="newTaskName" placeholder="e.g., Join Telegram Channel">
            </div>
            <div class="form-group">
                <label>Reward Amount (MC)</label>
                <input type="number" id="newTaskReward" placeholder="e.g., 50">
            </div>
            <div class="form-group">
                <label>Task Link / Details</label>
                <input type="text" id="newTaskLink" placeholder="https://t.me/...">
            </div>
            <button class="btn btn-approve" onclick="createTask()">Publish Task</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xqxnpdqzsnlmeltyuucg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxeG5wZHF6c25sbWVsdHl1dWNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NDI0NjksImV4cCI6MjEwMTAxODQ2OX0.1AYsGB2Pi1vUp1Q9tLCX8qF0zbvh-lFgHpsDBpbUphA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadWithdrawals() {
            let { data } = await supabaseClient.from('withdrawals').select('*').order('created_at', { ascending: false });
            let html = '';
            if (data && data.length > 0) {
                for (let w of data) {
                    let currentStatus = (w.status || 'pending').toLowerCase();
                    let recordId = w.id;
                    
                    let userUname = 'N/A';
                    let { data: uData } = await supabaseClient.from('users').select('username').eq('telegram_id', w.telegram_id).single();
                    if (uData && uData.username) { userUname = uData.username; }

                    html += `<div class="card">
                        <p><b>Username:</b> @${userUname}</p>
                        <p><b>User ID:</b> ${w.telegram_id}</p>
                        <p><b>Amount:</b> ${w.amount_mc} MC</p>
                        <p><b>Method:</b> ${w.payment_method} (${w.account_detail})</p>
                        <p><b>Status:</b> <span class="status-badge status-${currentStatus}">${currentStatus}</span></p>
                        ${currentStatus === 'pending' ? `
                            <div class="actions">
                                <button class="btn btn-approve" onclick="updateStatus('withdrawals', ${recordId}, 'approved')">Approve</button>
                                <button class="btn btn-reject" onclick="updateStatus('withdrawals', ${recordId}, 'rejected')">Reject</button>
                            </div>
                        ` : ''}
                    </div>`;
                }
            } else { html = '<div class="empty-msg">No withdrawals found.</div>'; }
            document.getElementById('list-withdrawals').innerHTML = html;
        }

        async function loadTasks() {
            let { data } = await supabaseClient.from('task_submissions').select('*').order('created_at', { ascending: false });
            let html = '';
            if (data && data.length > 0) {
                for (let t of data) {
                    let currentStatus = (t.status || 'pending').toLowerCase();
                    let recordId = t.id;
                    
                    let userUname = 'N/A';
                    let { data: uData } = await supabaseClient.from('users').select('username').eq('telegram_id', t.telegram_id).single();
                    if (uData && uData.username) { userUname = uData.username; }

                    html += `<div class="card">
                        <p><b>Username:</b> @${userUname}</p>
                        <p><b>User ID:</b> ${t.telegram_id}</p>
                        <p><b>Task:</b> ${t.task_name} (+${t.reward_amount} MC)</p>
                        <p><b>Status:</b> <span class="status-badge status-${currentStatus}">${currentStatus}</span></p>
                        ${currentStatus === 'pending' ? `
                            <div class="actions">
                                <button class="btn btn-approve" onclick="updateStatus('task_submissions', ${recordId}, 'approved')">Approve</button>
                                <button class="btn btn-reject" onclick="updateStatus('task_submissions', ${recordId}, 'rejected')">Reject</button>
                            </div>
                        ` : ''}
                    </div>`;
                }
            } else { html = '<div class="empty-msg">No submissions found.</div>'; }
            document.getElementById('list-tasks').innerHTML = html;
        }

        async function loadUsers() {
            let { data } = await supabaseClient.from('users').select('*').order('created_at', { ascending: false });
            let html = '';
            if (data && data.length > 0) {
                data.forEach(u => {
                    let rowId = u.id || u.telegram_id;
                    html += `<div class="card">
                        <p><b>Username:</b> @${u.username || 'N/A'}</p>
                        <p><b>Telegram ID:</b> ${u.telegram_id}</p>
                        <p><b>Balance:</b> <span style="color:var(--accent-color);">${u.balance} MC</span></p>
                        <div class="actions">
                            <input type="number" id="bal_${rowId}" placeholder="New Balance" style="flex:1; padding:5px; background:#0f172a; border:1px solid #333; color:#fff; border-radius:4px;">
                            <button class="btn btn-edit" onclick="updateBalance('${rowId}', ${u.id ? 'true' : 'false'})">Update Balance</button>
                        </div>
                    </div>`;
                });
            } else { html = '<div class="empty-msg">No users found.</div>'; }
            document.getElementById('list-users').innerHTML = html;
        }

        async function updateBalance(identifier, isById) {
            let newVal = document.getElementById('bal_' + identifier).value;
            if(newVal === '') return alert('Please enter amount');
            
            let query = supabaseClient.from('users').update({ balance: parseFloat(newVal) });
            if(isById) { query = query.eq('id', identifier); } 
            else { query = query.eq('telegram_id', identifier); }

            let { error } = await query;
            if(error) { alert('Error: ' + error.message); } 
            else { alert('Balance updated successfully!'); loadUsers(); }
        }

        async function createTask() {
            let name = document.getElementById('newTaskName').value;
            let reward = document.getElementById('newTaskReward').value;
            let link = document.getElementById('newTaskLink').value;
            if(!name || !reward) return alert('Fill required fields');
            
            let { error } = await supabaseClient.from('tasks').insert([{ 
                task_name: name, 
                reward: parseFloat(reward), 
                link: link, 
                status: 'active' 
            }]);
            
            if(error) {
                alert('Error creating task: ' + error.message);
            } else { 
                alert('Task published successfully!'); 
                document.getElementById('newTaskName').value = ''; 
                document.getElementById('newTaskReward').value = ''; 
                document.getElementById('newTaskLink').value = '';
            }
        }

        async function updateStatus(table, recordId, status) {
            let { error } = await supabaseClient.from(table).update({ status: status }).eq('id', recordId);
            if(error) { 
                alert('Error updating status: ' + error.message); 
            } else { 
                alert('Updated to ' + status); 
                table === 'withdrawals' ? loadWithdrawals() : loadTasks(); 
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            ['withdrawals', 'tasks', 'users', 'add_task'].forEach(t => document.getElementById('section-' + t).style.display = 'none');
            
            event.target.classList.add('active');
            document.getElementById('section-' + tab).style.display = 'block';

            if(tab === 'withdrawals') loadWithdrawals();
            if(tab === 'tasks') loadTasks();
            if(tab === 'users') loadUsers();
        }

        loadWithdrawals();
    </script>
</body>
</html>
